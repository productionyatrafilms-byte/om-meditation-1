<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <style>
      .language-container {
        opacity: 1 !important;
        pointer-events: auto !important;
        z-index: 99999 !important;
      }

      .language-container div {
        pointer-events: auto !important;
        cursor: pointer;
      }

      .back-btn {
        z-index: 99999;
      }
    </style>
  </head>
  <body>
    <!-- ───────────────── AUDIO ELEMENTS START ───────────────── -->
    <audio
      id="pranamAudio"
      src="./assets/audio/pranam.mp3"
      preload="auto"
    ></audio>

    <audio id="popAudio" src="./assets/audio/pop.mp3" preload="auto"></audio>
    <!-- ───────────────── AUDIO ELEMENTS END ───────────────── -->

    <a href="topic-5.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>

    <div class="pranam-container">
      <div class="pranam-img">
        <div class="pranam-video">
          <video src="./assets/videos/pranam.mp4" autoplay muted></video>
        </div>
        <span data-lang-key="pranam"></span>
        <img src="./assets/images/pranam-img.png" alt="" />
      </div>
      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/images/home-btn-1.png" alt="" />
      </a>
    </div>

    <script src="./assets/js/app.js"></script>

    <script>
      /* ───────────────── AUDIO JS START ───────────────── */

      const pranamAudio = document.getElementById("pranamAudio");
      const popAudio = document.getElementById("popAudio");

      let pranamPlayed = false;

      // Generic sound player — restarts the clip every time
      function playSound(audioEl) {
        if (!audioEl) return;

        try {
          audioEl.currentTime = 0;
          audioEl.volume = 1;
          audioEl.play().catch(function () {});
        } catch (err) {}
      }

      function playPopSound() {
        playSound(popAudio);
      }

      // ── pranam.mp3 — page load only ──
      // Browsers block autoplay until the page has been interacted with.
      // So: try on load, and if the browser refuses, retry once on the first
      // interaction. It is never re-triggered by button clicks.
      function playPranamAudio() {
        if (pranamPlayed || !pranamAudio) return;

        pranamAudio.currentTime = 0;
        pranamAudio.volume = 1;

        const playPromise = pranamAudio.play();

        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(function () {
              pranamPlayed = true;
              removeUnlockListeners();
            })
            .catch(function () {
              addUnlockListeners();
            });
        } else {
          pranamPlayed = true;
        }
      }

      function addUnlockListeners() {
        document.addEventListener("pointerdown", playPranamAudio);
        document.addEventListener("keydown", playPranamAudio);
        document.addEventListener("touchstart", playPranamAudio);
      }

      function removeUnlockListeners() {
        document.removeEventListener("pointerdown", playPranamAudio);
        document.removeEventListener("keydown", playPranamAudio);
        document.removeEventListener("touchstart", playPranamAudio);
      }

      // Wait for a sound to finish (plus a small buffer) before navigating away
      function navigateAfterSound(audioEl, href, buffer) {
        const extra = typeof buffer === "number" ? buffer : 200;

        let navigated = false;

        function go() {
          if (navigated) return;

          navigated = true;
          window.location.href = href;
        }

        let waitTime = extra;

        if (audioEl && audioEl.duration && !isNaN(audioEl.duration)) {
          waitTime = audioEl.duration * 1000 + extra;
        }

        // safety cap so a long or broken clip never blocks navigation
        if (waitTime > 2500) waitTime = 2500;

        if (audioEl) {
          audioEl.addEventListener("ended", function onEnded() {
            audioEl.removeEventListener("ended", onEnded);
            setTimeout(go, extra);
          });
        }

        setTimeout(go, waitTime);
      }

      // Links navigate away, so play the sound first, then go
      function bindNavSound(selector, soundFn, audioEl, buffer) {
        const links = document.querySelectorAll(selector);

        links.forEach(function (link) {
          link.addEventListener("click", function (e) {
            const href = link.getAttribute("href");

            if (!href || href === "#") {
              soundFn();
              return;
            }

            e.preventDefault();
            soundFn();

            // stop the pranam clip so the two sounds don't overlap
            if (pranamAudio) {
              pranamAudio.pause();
              pranamAudio.currentTime = 0;
            }

            navigateAfterSound(audioEl, href, buffer);
          });
        });
      }

      function bindPageSounds() {
        // back button → pop.mp3
        bindNavSound(".back-btn", playPopSound, popAudio, 200);

        // home button → pop.mp3
        bindNavSound(".home-btn-1", playPopSound, popAudio, 200);
      }

      bindPageSounds();

      window.addEventListener("load", playPranamAudio);

      /* ───────────────── AUDIO JS END ───────────────── */
    </script>
  </body>
</html>
